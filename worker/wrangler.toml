name = "model-board"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "model-board"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Override ADMIN_PASSWORD via Cloudflare dashboard Secrets (never commit real passwords)
ADMIN_PASSWORD = "changeme"

[[triggers]]
crons = ["0 8 * * *"]
